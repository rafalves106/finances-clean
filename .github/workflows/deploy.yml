name: Deploy

# Roda depois que o workflow "CI" (build/test) terminar com sucesso em main
# ou develop. Não builda/testa de novo aqui - só faz o deploy do que já foi
# validado.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["main", "develop"]'), github.event.workflow_run.head_branch)
    runs-on: [self-hosted, macOS, falveshub-server]
    steps:
      - name: Resolve ambiente pela branch
        id: env
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            echo "path=/Users/falves/Dev/Servidor/financas" >> "$GITHUB_OUTPUT"
            echo "port=8084" >> "$GITHUB_OUTPUT"
          else
            echo "path=/Users/falves/Dev/Servidor/financas-hml" >> "$GITHUB_OUTPUT"
            echo "port=5174" >> "$GITHUB_OUTPUT"
          fi

      - name: Atualizar código (git reset --hard na branch)
        working-directory: ${{ steps.env.outputs.path }}
        run: |
          git fetch origin
          git reset --hard "origin/${{ github.event.workflow_run.head_branch }}"

      - name: Rebuild e restart dos containers
        working-directory: ${{ steps.env.outputs.path }}
        run: docker compose up -d --build

      - name: Healthcheck
        run: |
          sleep 15
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${{ steps.env.outputs.port }}")
          if [ "$code" != "200" ]; then echo "Healthcheck falhou: HTTP $code" >&2; exit 1; fi
          echo "OK - HTTP $code"
