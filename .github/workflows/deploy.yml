name: Deploy

# Roda depois que o workflow "CI" (build/test) terminar com sucesso em main
# ou develop. Não builda/testa de novo aqui — só faz o deploy do que já foi
# validado.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["main", "develop"]'), github.event.workflow_run.head_branch)
    runs-on: [self-hosted, Windows, falveshub-server]
    steps:
      - name: Resolve ambiente pela branch
        id: env
        shell: pwsh
        run: |
          if ("${{ github.event.workflow_run.head_branch }}" -eq "main") {
            "path=C:\Servidor\financas"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "port=8084"                      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "path=C:\Servidor\financas-hml"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "port=5174"                      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Atualizar código (git reset --hard na branch)
        shell: pwsh
        working-directory: ${{ steps.env.outputs.path }}
        run: |
          git fetch origin
          git reset --hard "origin/${{ github.event.workflow_run.head_branch }}"

      - name: Rebuild e restart dos containers
        shell: pwsh
        working-directory: ${{ steps.env.outputs.path }}
        run: docker compose up -d --build

      - name: Healthcheck
        shell: pwsh
        run: |
          Start-Sleep -Seconds 15
          $resp = Invoke-WebRequest -Uri "http://localhost:${{ steps.env.outputs.port }}" -UseBasicParsing -TimeoutSec 20
          if ($resp.StatusCode -ne 200) { throw "Healthcheck falhou: HTTP $($resp.StatusCode)" }
          Write-Host "OK - HTTP $($resp.StatusCode)"
